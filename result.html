<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Result Checker - AL-HAQQ MODEL COLLEGE</title>
<style>
body{font-family:Arial,sans-serif;background:#0a0a5c;color:white;margin:0;padding:15px;text-align:center}
.logo{width:110px;height:110px;border-radius:50%;border:4px solid #ffcc00;object-fit:cover;background:white}
.box{background:white;color:#222;max-width:450px;margin:15px auto;padding:20px;border-radius:15px;text-align:left}
h1{font-size:22px;margin:5px} h2{color:#0a0a5c;text-align:center}
input,select,button{width:100%;padding:12px;margin:7px 0;border:1px solid #ccc;border-radius:8px;font-size:16px;box-sizing:border-box}
button{background:#b34700;color:white;border:none;font-weight:bold;cursor:pointer}
button.green{background:green} .hide{display:none}
.result{border:1px solid #ddd;padding:10px;border-radius:8px;margin:8px 0;background:#f9f9f9}
a{color:#ffcc00}
</style>
</head>
<body>
<img src="IMG-20261106-WA0020.jpg" class="logo" alt="School Logo">
<h1>AL-HAQQ MODEL COLLEGE</h1>
<p>📍 Olohunda via Eyenkorin, Asa, Ilorin, Kwara State, Nigeria</p>
<p><b>MOTTO: BREEDING EXCELLENCE</b></p>
<p>Result Checker Portal</p>
<p><a href="index.html">← Back to Home</a></p>
<div class="box" id="authBox">
<h2>Login / Register</h2>
<input id="name" placeholder="Full Name (for Register)">
<input id="email" placeholder="Gmail e.g musa@gmail.com">
<input id="pass" type="password" placeholder="Password e.g 1234">
<select id="role"><option value="Student">Student</option><option value="Staff">Staff / Teacher</option></select>
<select id="class"><option>JSS 1</option><option>JSS 2</option><option>JSS 3</option><option>SSS 1</option><option>SSS 2</option><option>SSS 3</option></select>
<button onclick="register()">Register</button>
<button class="green" onclick="login()">Login</button>
<p id="msg" style="color:red;text-align:center"></p>
</div>
<div class="box hide" id="staffBox">
<h2>Staff Panel - Add Result</h2>
<p id="staffWelcome"></p>
<input id="sEmail" placeholder="Student Gmail">
<select id="sClass"><option>JSS 1</option><option>JSS 2</option><option>JSS 3</option><option>SSS 1</option><option>SSS 2</option><option>SSS 3</option></select>
<input id="subject" placeholder="Subject e.g Maths">
<input id="score" type="number" placeholder="Score e.g 80">
<button onclick="saveResult()">Save Result</button>
<button onclick="logout()" style="background:#555">Logout</button>
<p id="staffMsg"></p>
</div>
<div class="box hide" id="studentBox">
<h2>My Results</h2>
<p id="stuWelcome"></p>
<div id="myResults"></div>
<button onclick="logout()" style="background:#555">Logout</button>
</div>
<script>
function getUsers(){return JSON.parse(localStorage.getItem('users')||'[]')}
function saveUsers(u){localStorage.setItem('users',JSON.stringify(u))}
function getResults(){return JSON.parse(localStorage.getItem('results')||'[]')}
function register(){
 let n=document.getElementById('name').value.trim();
 let e=document.getElementById('email').value.trim().toLowerCase();
 let p=document.getElementById('pass').value.trim();
 let r=document.getElementById('role').value;
 let c=document.getElementById('class').value;
 if(!n||!e||!p){document.getElementById('msg').innerText='Fill Name, Gmail and Password';return}
 let users=getUsers();
 if(users.find(x=>x.email===e)){document.getElementById('msg').innerText='Already registered, please Login';return}
 users.push({name:n,email:e,pass:p,role:r,class:c}); saveUsers(users);
 document.getElementById('msg').style.color='green'; document.getElementById('msg').innerText='Registered! Now tap Login';
}
function login(){
 let e=document.getElementById('email').value.trim().toLowerCase();
 let p=document.getElementById('pass').value.trim();
 let users=getUsers(); let u=users.find(x=>x.email===e && x.pass===p);
 if(!u){document.getElementById('msg').innerText='Wrong Gmail or Password';return}
 localStorage.setItem('current',JSON.stringify(u)); showPanel(u);
}
function showPanel(u){
 document.getElementById('authBox').classList.add('hide');
 if(u.role==='Staff'){
  document.getElementById('staffBox').classList.remove('hide');
  document.getElementById('staffWelcome').innerText='Welcome '+u.name;
 } else {
  document.getElementById('studentBox').classList.remove('hide');
  document.getElementById('stuWelcome').innerText='Welcome '+u.name+' - '+u.class;
  let res=getResults().filter(x=>x.email===u.email);
  let html=res.length? '':'<p>No result yet. Ask your teacher.</p>';
  res.forEach(r=>{html+='<div class="result"><b>'+r.subject+'</b> - '+r.score+'/100<br>Class: '+r.class+'</div>'});
  document.getElementById('myResults').innerHTML=html;
 }
}
function saveResult(){
 let e=document.getElementById('sEmail').value.trim().toLowerCase();
 let c=document.getElementById('sClass').value;
 let s=document.getElementById('subject').value.trim();
 let sc=document.getElementById('score').value;
 if(!e||!s||!sc){document.getElementById('staffMsg').innerText='Fill all fields';return}
 let res=getResults(); res.push({email:e,class:c,subject:s,score:sc}); localStorage.setItem('results',JSON.stringify(res));
 document.getElementById('staffMsg').style.color='green'; document.getElementById('staffMsg').innerText='Saved! '+s+' '+sc+' for '+e;
}
function logout(){localStorage.removeItem('current');location.reload()}
let cur=JSON.parse(localStorage.getItem('current')||'null'); if(cur) showPanel(cur);
</script>
</body>
</html>
